<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" fill="#17243b" role="img" aria-labelledby="development-title development-description">
  <title id="development-title">Caldova development and lab architecture</title>
  <desc id="development-description">The attendee uses PowerShell and a supplied Python controller on a Skillable Windows VM. Microsoft Foundry provides the persistent orchestrator and specialist model sessions. Local function handlers and a VM-owned stdio MCP bridge mediate scoped aca CLI execution in assigned remote Sandboxes. Source and frozen data prepare the primary, then the learner captures a baseline snapshot and manually creates three isolated clones. Implementors can change only their assigned feature file. Only the two accepted feature files transfer to the same primary for independent tests, then to the same governance clone for read-only review after those tests pass. Local run evidence is separate from optional portal observations and human release approval. The canvas background is transparent.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #526179; }
      .section { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #526179; }
      .heading { font-size: 22px; font-weight: 650; }
      .body { font-size: 17px; fill: #33465f; }
      .small { font-size: 15px; fill: #526179; }
      .mono { font-family: Consolas, "Courier New", monospace; }
      .frame { fill: none; stroke: #bdc9d8; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #bdc9d8; stroke-width: 1.7; }
      .blue { fill: #eef6ff; stroke: #92b8e4; stroke-width: 1.7; }
      .purple { fill: #f5f1ff; stroke: #b6a2e3; stroke-width: 1.7; }
      .teal { fill: #ecf8f5; stroke: #84beb0; stroke-width: 1.7; }
      .amber { fill: #fff7e8; stroke: #dcba72; stroke-width: 1.7; }
      .execution { fill: none; stroke: #2464a7; stroke-width: 2.5; stroke-linejoin: round; }
      .model { fill: none; stroke: #7952b3; stroke-width: 2.5; stroke-linejoin: round; }
      .accepted { fill: none; stroke: #157963; stroke-width: 2.5; stroke-linejoin: round; }
      .inspection { fill: none; stroke: #718198; stroke-width: 2; stroke-dasharray: 6 6; stroke-linejoin: round; }
    </style>
    <marker id="dev-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2464a7"/>
    </marker>
    <marker id="dev-arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7952b3"/>
    </marker>
    <marker id="dev-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#157963"/>
    </marker>
    <marker id="dev-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#718198"/>
    </marker>
  </defs>

  <text class="title" x="48" y="62">Development and lab setup</text>
  <text class="subtitle" x="48" y="98">Foundry reasons. The VM owns execution. Sandboxes isolate the work.</text>
  <text class="section" x="48" y="155">1 / DEVELOPMENT CONTROL PLANE</text>

  <rect class="frame" x="48" y="180" width="610" height="340" rx="20"/>
  <text x="70" y="217" font-size="24" font-weight="650">Skillable Windows lab VM</text>
  <g data-card="vm-controller">
    <rect class="blue" x="70" y="244" width="566" height="65" rx="12"/>
    <text x="92" y="272" font-size="21" font-weight="650">PowerShell &gt; Python controller</text>
    <text x="92" y="296" font-size="16" fill="#33465f">Microsoft Agent Framework + allocated Azure CLI identity</text>
  </g>
  <g data-card="vm-tools">
    <rect class="blue" x="70" y="334" width="566" height="77" rx="12"/>
    <text x="92" y="365" font-size="21" font-weight="650">Local function handlers + stdio MCP</text>
    <text x="92" y="392" font-size="16" fill="#33465f">check_sandbox / dispatch_worker; bounded file + test tools</text>
  </g>
  <g data-card="scoped-cli">
    <rect class="card" x="70" y="444" width="220" height="55" rx="12"/>
    <text x="92" y="478" font-size="20" font-weight="650">Scoped aca CLI</text>
  </g>
  <g data-card="local-evidence">
    <rect class="card" x="338" y="444" width="298" height="55" rx="12"/>
    <text x="360" y="468" font-size="17" font-weight="650">Progress + local evidence</text>
    <text class="mono" x="360" y="488" font-size="13" fill="#526179">worker-result.json / failure.json</text>
  </g>
  <path class="execution" d="M 353 309 V 334" marker-end="url(#dev-arrow-blue)"/>
  <path class="execution" d="M 180 411 V 444" marker-end="url(#dev-arrow-blue)"/>
  <path class="execution" d="M 487 411 V 444" marker-end="url(#dev-arrow-blue)"/>

  <rect class="frame" x="898" y="180" width="654" height="210" rx="20"/>
  <text x="920" y="217" font-size="24" font-weight="650">Per-learner Microsoft Foundry</text>
  <g data-card="foundry-orchestrator">
    <rect class="purple" x="920" y="244" width="287" height="100" rx="12"/>
    <text x="940" y="275" font-size="20" font-weight="650">Persistent orchestrator</text>
    <text class="mono" x="940" y="303" font-size="16">caldova-orchestrator</text>
    <text x="940" y="326" font-size="14" fill="#526179">Saved model, instructions + tools</text>
  </g>
  <g data-card="foundry-specialists">
    <rect class="purple" x="1225" y="244" width="305" height="100" rx="12"/>
    <text x="1245" y="275" font-size="20" font-weight="650">Specialist model sessions</text>
    <text x="1245" y="303" font-size="16" fill="#33465f">Reasoning + tool requests</text>
    <text x="1245" y="326" font-size="14" fill="#526179">Not remote code execution</text>
  </g>
  <text class="small" x="920" y="372">Models request work; the controller mediates each action.</text>
  <text x="767" y="254" text-anchor="middle" font-size="16" fill="#526179">Model / tool exchange</text>
  <path class="model" d="M 636 272 H 898" marker-end="url(#dev-arrow-purple)"/>
  <path class="model" d="M 898 309 H 636" marker-end="url(#dev-arrow-purple)"/>
  <text x="767" y="335" text-anchor="middle" font-size="16" fill="#526179">Tool results / responses</text>

  <g data-card="portal-inspection">
    <rect class="card" x="898" y="425" width="654" height="95" rx="14" stroke-dasharray="6 5"/>
    <text x="920" y="455" font-size="20" font-weight="650">Browser inspection surfaces</text>
    <text x="920" y="480" font-size="16" fill="#33465f">Foundry | Sandboxes | Express | Azure Monitor (optional)</text>
    <text x="920" y="503" font-size="14" fill="#526179">Portal views do not attach to the running controller.</text>
  </g>
  <path class="inspection" d="M 658 462 H 898" marker-end="url(#dev-arrow-gray)"/>
  <text x="778" y="446" text-anchor="middle" font-size="15" fill="#526179">Browser</text>

  <path class="execution" d="M 180 499 V 567 H 770 V 620" marker-end="url(#dev-arrow-blue)"/>
  <text x="460" y="552" text-anchor="middle" font-size="17" font-weight="600" fill="#2464a7">Scoped remote execution in the assigned workspace</text>
  <text class="section" x="48" y="601">2 / LEARNER-CREATED SANDBOX WORKSPACES</text>

  <rect class="frame" x="48" y="620" width="1504" height="500" rx="20"/>
  <text x="70" y="658" font-size="24" font-weight="650">Azure Container Apps Sandboxes</text>
  <g data-card="source-and-data">
    <rect class="card" x="70" y="700" width="255" height="130" rx="14"/>
    <text x="92" y="736" font-size="21" font-weight="650">Source + frozen data</text>
    <text class="body" x="92" y="772">GitHub or staged bundle</text>
    <text class="body" x="92" y="802">Shared frozen artifact</text>
  </g>
  <g data-card="primary-preparation">
    <rect class="blue" x="390" y="700" width="320" height="130" rx="14"/>
    <text class="heading" x="412" y="736">Primary Sandbox</text>
    <text class="body" x="412" y="772">Source + toolchain + frozen data</text>
    <text x="412" y="802" font-size="16" fill="#526179">Non-root user; protected files</text>
  </g>
  <g data-card="baseline-snapshot">
    <rect class="purple" x="815" y="700" width="300" height="130" rx="14"/>
    <text class="heading" x="837" y="736">Baseline snapshot</text>
    <text class="body" x="837" y="772">Memory capture by the learner</text>
    <text x="837" y="802" font-size="16" fill="#526179">Common starting filesystem</text>
  </g>
  <g data-card="manual-portal-steps">
    <rect class="amber" x="1180" y="700" width="350" height="130" rx="14" stroke-dasharray="5 4"/>
    <text x="1202" y="736" font-size="21" font-weight="650">Manual portal steps</text>
    <text x="1202" y="765" font-size="16" fill="#33465f">Create / resume / snapshot</text>
    <text x="1202" y="791" font-size="16" fill="#33465f">Create 3 named clones</text>
    <text x="1202" y="817" font-size="16" fill="#33465f">Verify each clone's policy</text>
  </g>
