  <g data-card="clinical-clone">
    <rect class="teal" x="70" y="910" width="440" height="160" rx="16"/>
    <text class="heading" x="92" y="949">Clinical-trials clone</text>
    <text x="92" y="985" font-size="19" font-weight="600" fill="#157963">Implement trial_feature.py</text>
    <text x="92" y="1017" font-size="16" fill="#33465f">Writes only its assigned feature</text>
    <text x="92" y="1047" font-size="16" fill="#526179">Tests and data stay protected</text>
  </g>
  <g data-card="safety-clone">
    <rect class="teal" x="580" y="910" width="440" height="160" rx="16"/>
    <text class="heading" x="602" y="949">Drug-safety clone</text>
    <text x="602" y="985" font-size="19" font-weight="600" fill="#157963">Implement safety_feature.py</text>
    <text x="602" y="1017" font-size="16" fill="#33465f">Writes only its assigned feature</text>
    <text x="602" y="1047" font-size="16" fill="#526179">Tests and data stay protected</text>
  </g>
  <g data-card="governance-clone">
    <rect class="amber" x="1090" y="910" width="440" height="160" rx="16"/>
    <text class="heading" x="1112" y="949">Quality / governance clone</text>
    <text x="1112" y="985" font-size="19" font-weight="600" fill="#8a5a13">Read-only review</text>
    <text x="1112" y="1017" font-size="16" fill="#33465f">Receives the same accepted files</text>
    <text x="1112" y="1047" font-size="16" fill="#526179">Review only after primary tests pass</text>
  </g>
  <text x="70" y="685" font-size="16" fill="#526179">Each clone: isolated filesystem | Egress: Deny / Full; allow open.fda.gov | Tests and data remain protected</text>

  <path class="accepted" d="M 290 1070 V 1135 H 800 V 1070"/>
  <path class="accepted" d="M 545 1135 V 1200 H 255 V 1220" marker-end="url(#dev-arrow-teal)"/>
  <text x="564" y="1160" font-size="16" font-weight="600" fill="#157963">Only the two accepted feature files move</text>
  <text class="section" x="48" y="1188">3 / ACCEPT, TEST AND REVIEW</text>

  <g data-card="accepted-modules">
    <rect class="teal" x="70" y="1220" width="370" height="115" rx="14"/>
    <text x="92" y="1258" font-size="22" font-weight="650">Accepted feature files</text>
    <text x="92" y="1287" font-size="16" fill="#33465f">trial_feature.py + safety_feature.py</text>
    <text class="small" x="92" y="1312">Controller-mediated transfer</text>
  </g>
  <g data-card="primary-integration">
