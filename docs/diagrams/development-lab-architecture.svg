    <text x="532" y="1258" font-size="22" font-weight="650">Same primary: independent tests</text>
    <text x="532" y="1287" font-size="16" fill="#33465f">Integrate both files + application acceptance</text>
    <text class="small" x="532" y="1312">Not a new workspace</text>
  </g>
  <g data-card="governance-review">
    <rect class="amber" x="1020" y="1220" width="510" height="115" rx="14"/>
    <text x="1042" y="1258" font-size="22" font-weight="650">Same governance clone: review</text>
    <text x="1042" y="1287" font-size="16" fill="#33465f">Receives both files only after primary tests pass</text>
    <text class="small" x="1042" y="1312">Read-only review + blocker report</text>
  </g>
  <path class="accepted" d="M 440 1277 H 510" marker-end="url(#dev-arrow-teal)"/>
  <path class="accepted" d="M 950 1277 H 1020" marker-end="url(#dev-arrow-teal)"/>
  <text x="985" y="1259" text-anchor="middle" font-size="14" font-weight="650" fill="#157963">PASS</text>
  <path class="inspection" d="M 1530 1000 H 1574 V 1277 H 1530" marker-end="url(#dev-arrow-gray)"/>

  <text x="48" y="1376" font-size="16" fill="#526179">Tests and governance review do not approve release. Build, separate human approval and deployment follow in the application diagram.</text>
</svg>
