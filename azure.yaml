name: lab722-research
resourceGroup: ${AZURE_RESOURCE_GROUP}
workflows:
  up:
    steps:
      - azd: provision
infra:
  provider: bicep
  path: infra/local-reactor
  module: main
hooks:
  preup:
    shell: pwsh
    run: |
      & .\scripts\prepare-local-reactor.ps1 -Mode Validate
    interactive: true
    continueOnError: false
  postprovision:
    shell: pwsh
    run: |
      & .\scripts\prepare-local-reactor.ps1 -Mode Research
    interactive: true
    continueOnError: false
requiredVersions:
  azd: ">= 1.35.1"
